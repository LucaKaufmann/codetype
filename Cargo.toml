[package]
name = "codetype"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Kaufmann <lucakaufmann92@gmail.com>"]
description = "A terminal typing trainer that turns your own Git repository's source code into typing exercises using tree-sitter."
license = "MIT"
repository = "https://github.com/LucaKaufmann/codetype"
homepage = "https://github.com/LucaKaufmann/codetype"
readme = "README.md"
keywords = ["typing", "tui", "tree-sitter", "practice", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
rand = "0.10.1"
ratatui = "0.30.0"
thiserror = "2.0.18"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
